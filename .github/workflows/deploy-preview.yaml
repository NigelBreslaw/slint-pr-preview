name: Deploy UI Preview

on:
  workflow_run:
    workflows: [Build UI Preview]
    types: [completed]

permissions:
  actions: read
  contents: read
  deployments: write
  issues: write
  pull-requests: write

jobs:
  prepare:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.request.outputs.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Find preview artifact
        id: artifact
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.payload.workflow_run.id,
            });
            core.setOutput('exists', artifacts.some(artifact => artifact.name === 'ui-preview' && !artifact.expired));
      - uses: actions/download-artifact@v4
        if: steps.artifact.outputs.exists == 'true'
        with:
          name: ui-preview
          path: preview-deploy/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Resolve artifact PR and current configuration
        id: request
        if: steps.artifact.outputs.exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { checkArtifact } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/preview-actions.mjs`);
            await checkArtifact({ github, context, core });

  deploy:
    needs: prepare
    if: needs.prepare.outputs.number != ''
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-preview-${{ needs.prepare.outputs.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: ui-preview
          path: preview-deploy/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Recheck PR and configuration before uploading
        id: request
        uses: actions/github-script@v7
        with:
          script: |
            const { checkArtifact } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/preview-actions.mjs`);
            await checkArtifact({ github, context, core });
      - name: Validate static artifact and configure personal Worker
        if: steps.request.outputs.number != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          if (!process.env.CLOUDFLARE_ACCOUNT_ID) throw new Error('Personal Cloudflare account secret is not configured');
          const visit = directory => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const file = path.join(directory, entry.name);
              if (entry.isSymbolicLink() || ['_worker.js', '_redirects', '_headers'].includes(entry.name)) throw new Error(`Unexpected artifact file: ${file}`);
              if (entry.isDirectory()) visit(file);
            }
          };
          visit('preview-deploy/dist');
          fs.writeFileSync('preview-deploy/dist/_headers', '/assets/*\n  Cache-Control: public, max-age=31536000, immutable\n');
          fs.writeFileSync('preview-deploy/wrangler.jsonc', JSON.stringify({
            name: 'nigel-slint-pr-preview', compatibility_date: '2026-11-07',
            account_id: process.env.CLOUDFLARE_ACCOUNT_ID, preview_urls: true,
            assets: { directory: './dist' },
          }));
          JS
      - name: Upload Worker version
        if: steps.request.outputs.number != ''
        id: deploy
        working-directory: preview-deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ steps.request.outputs.number }}
          HEAD_SHA: ${{ steps.request.outputs.head }}
          CONFIG_HASH: ${{ steps.request.outputs.hash }}
        run: |
          set -o pipefail
          npx --yes wrangler@4.158.0 versions upload --preview-alias "pr-$PR_NUMBER" --message "$HEAD_SHA config:$CONFIG_HASH" 2>&1 | tee /tmp/wrangler-output.txt
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/wrangler-output.txt | head -1)
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Publish current PR preview link
        if: steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const { publishPreview } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/preview-actions.mjs`);
            await publishPreview({ github, context, core });
